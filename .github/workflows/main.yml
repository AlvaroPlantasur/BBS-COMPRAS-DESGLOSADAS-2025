permissions:
 
  contents: read 

name: Ejecutar script Compras Desglosadas y actualizar desde SharePoint

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 11 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  run-and-update:
    runs-on: ubuntu-latest
    env:
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      
      EXCEL_FILE_PATH: ${{ secrets.EXCEL_FILE_PATH }} 
      
      PA_DOWNLOAD_URL: ${{ secrets.PA_DOWNLOAD_URL_COMPRAS_DESGLOSADAS }} 
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # --- PASO PARA DESCARGAR EL ARCHIVO ---
      - name: Descargar Excel (${{ env.EXCEL_FILE_PATH }}) desde SharePoint vía Power Automate
        run: |
          echo "Descargando archivo ${{ env.EXCEL_FILE_PATH }} desde Power Automate..."
          curl -L -o "${{ env.EXCEL_FILE_PATH }}" "${{ env.PA_DOWNLOAD_URL }}"
          if [ -f "${{ env.EXCEL_FILE_PATH }}" ]; then
            echo "Archivo ${{ env.EXCEL_FILE_PATH }} descargado exitosamente."
            ls -l "${{ env.EXCEL_FILE_PATH }}" 
          else
            echo "Error: No se pudo descargar el archivo ${{ env.EXCEL_FILE_PATH }}."
            exit 1
          fi

      - name: Listar archivos en el directorio (después de la descarga)
        run: ls -la

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x' 

      - name: Instalar dependencias
        run: pip install -r requirements.txt 

      - name: Ejecutar script de actualización del Excel (main.py para Compras Desglosadas)
        run: python main.py 

      - name: Listar archivos en el directorio (después de ejecutar el script)
        run: ls -la

      # --- PASO OPCIONAL: COMMIT Y PUSH AL REPOSITORIO ---
      
      - name: Commit updated Excel file (Opcional)
        if: false 
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add "${{ env.EXCEL_FILE_PATH }}"
          git commit -m "Actualizar ${{ env.EXCEL_FILE_PATH }} con datos del $(date +'%Y-%m-%d %H:%M:%S')" || echo "No hay cambios que commitear en ${{ env.EXCEL_FILE_PATH }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- ENVIAR ARCHIVO ACTUALIZADO A POWER AUTOMATE ---
      
      - name: Enviar archivo actualizado a Power Automate
        run: |
          echo "Enviando archivo ${{ env.EXCEL_FILE_PATH }} a Power Automate..."
          # URL de Power Automate para subir el archivo "Compras Desglosadas"
          curl -X POST "https://prod-66.westeurope.logic.azure.com:443/workflows/80fa1518fd924d88b41decb16144d815/triggers/manual/paths/invoke?api-version=2016-06-01&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=oFzlt37QBnIlga4niElPIArKO4Mz1lU0kxLWBmuroDg" \
            -H "Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" \
            --data-binary "@${{ env.EXCEL_FILE_PATH }}"
